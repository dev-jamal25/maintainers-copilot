[project]
name = "maintainers-copilot-ml"
version = "0.0.0"
description = "Maintainer's Copilot ML utilities"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate",
    "anthropic",
    "evaluate",
    "hvac",
    "joblib",
    "numpy",
    "rank-bm25",
    "scikit-learn",
    "sentence-transformers",
    "torch",
    "transformers",
    "wandb",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
