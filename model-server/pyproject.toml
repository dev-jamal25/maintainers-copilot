[project]
name = "maintainers-copilot-model-server"
version = "0.0.0"
description = "Maintainer's Copilot model server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "torch",
    "transformers",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
