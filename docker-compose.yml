name: maintainers-copilot

services:
  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    command: >
      sh -c "uv run --no-dev python -m app.core.lifespan &&
             uv run --no-dev python -c 'import time; print(\"api placeholder: startup checks passed; sleeping\", flush=True); time.sleep(10**9)'"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-root-token}
      DATABASE_URL: postgresql+asyncpg://${DATABASE_USER:-maintainers_copilot}@db:5432/${DATABASE_NAME:-maintainers_copilot}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      vault:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - app_network

  chatbot:
    build:
      context: ./frontend/streamlit
      dockerfile: docker/Dockerfile
    ports:
      - "${CHATBOT_PORT:-8501}:8501"
    networks:
      - app_network

  widget:
    build:
      context: ./frontend/widget
      dockerfile: docker/Dockerfile
    ports:
      - "${WIDGET_PORT:-3000}:3000"
    networks:
      - app_network

  model-server:
    build:
      context: ./model-server
      dockerfile: docker/Dockerfile
    ports:
      - "${MODEL_SERVER_PORT:-8001}:8001"
    networks:
      - app_network

  host:
    build:
      context: ./frontend/host
      dockerfile: docker/Dockerfile
    ports:
      - "${HOST_PORT:-8080}:80"
    networks:
      - app_network

  migrate:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    command: uv run --no-dev alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${DATABASE_USER:-maintainers_copilot}@db:5432/${DATABASE_NAME:-maintainers_copilot}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-maintainers_copilot}
      POSTGRES_USER: ${DATABASE_USER:-maintainers_copilot}
      # TODO(day-1+): replace local trust mode with Vault-backed DB password.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      # TODO(day-1+): move local-only MinIO credentials to Vault.
      MINIO_ROOT_USER: local-minio-user
      MINIO_ROOT_PASSWORD: local-minio-password
    volumes:
      - minio_data:/data
    networks:
      - app_network

  vault:
    image: hashicorp/vault
    command: server -dev
    cap_add:
      - IPC_LOCK
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      SKIP_SETCAP: "true"
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-root-token}
    networks:
      - app_network

networks:
  app_network:

volumes:
  postgres_data:
  redis_data:
  minio_data:
