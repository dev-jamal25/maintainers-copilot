name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync dev dependencies
        run: uv sync --dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync dev dependencies
        run: uv sync --dev
      - name: Mypy
        run: uv run mypy app tests

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync dev dependencies
        run: uv sync --dev
      - name: Pytest
        run: uv run pytest

  day2-ml:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync ML dependencies
        run: uv sync --project ml --dev
      - name: ML Ruff check
        run: uv run --project ml ruff check evals ml
      - name: ML Ruff format check
        run: uv run --project ml ruff format --check evals ml
      - name: ML mypy
        working-directory: ml
        run: uv run mypy .
      - name: ML pytest
        working-directory: ml
        run: uv run pytest -q
      - name: Classification golden eval
        run: uv run --project ml python -m evals.classification_eval

  day2-model-server:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    defaults:
      run:
        working-directory: model-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync model-server dependencies
        run: uv sync --dev
      - name: Model-server Ruff check
        run: uv run ruff check .
      - name: Model-server Ruff format check
        run: uv run ruff format --check .
      - name: Model-server mypy
        run: uv run mypy app tests
      - name: Model-server pytest
        run: uv run pytest -q

  rag-eval:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync ML dependencies
        run: uv sync --project ml --dev
      - name: RAG eval mock gate
        run: >
          uv run --project ml python -m evals.rag_eval --mock
          --advanced-chunks ml/tests/fixtures/rag/ci_advanced_chunks.jsonl
          --naive-chunks ml/tests/fixtures/rag/ci_naive_chunks.jsonl
          --golden ml/tests/fixtures/rag/ci_golden.jsonl
          --thresholds ml/tests/fixtures/rag/ci_thresholds.json
          --report artifacts/evals/rag_eval_ci_report.json
          --snapshot-dir artifacts/evals/rag_ci_retrieved_snapshots

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded secrets in source/config
        shell: bash
        run: |
          # Scoped to where leaks actually matter; skips .github/, deliverables/, .env.example, README/CLAUDE by construction.
          if grep -rnE 'sk-|ANTHROPIC_API_KEY=|LANGFUSE_SECRET_KEY=|WANDB_API_KEY=|JWT_SECRET|password=|PASSWORD=' backend/ frontend/ scripts/ docker-compose.yml; then
            echo "::error::Potential hardcoded secret detected. Move to Vault and replace with a runtime lookup."
            exit 1
          fi

  redaction-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync dev dependencies
        run: uv sync --dev
      - name: Redaction test (fake secrets must never leak)
        run: uv run pytest tests/infra/test_redaction.py -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compose config sanity
        run: docker compose config --quiet
      - name: Build all compose images
        run: docker compose build

  stack-smoke-test:
    # Deterministic core only: bring up Postgres+pgvector and apply the Alembic migrations.
    # (The full api/model-server/vault stack needs real secrets + weights, so it is not asserted here.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Start database
        run: docker compose up -d --wait db
      - name: Apply migrations against real Postgres + pgvector
        run: docker compose run --rm migrate
      - name: Teardown
        if: always()
        run: docker compose down -v
